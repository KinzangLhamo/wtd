<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Event Attribute</title>
</head>
<body>
    <input type="text" placeholder="username" onkeydown="this.style.backgroundColor='red'"> <br><br>
    <input type="password" placeholder="password" onkeydown="this.style.backgroundColor='green'"> <br><br>
    <input type="text" placeholder="first name" onchange="this.style.text.transform='uppercase'"> <br><br>  
    <input type="text" placeholder="last name" oninput=""this.style.backgroundColor='yellow'> <br><br>
    <input type="text" placeholder="nick name" onfocus="this.style.backgroundColor='purple'"> <br><br>
    <input type="text" placeholder="nick name" on blur="this.style.backgroundColor='lightblue'"> <br><br>

    <form onsubmit="alert('Form submitted!'); return false;" onreset="alert('Form reset')">
        <input type="text" placeholder="Type here ...">
        <input type="submit" value="Submit">
        <input type="reset" value="reset">
    </form>

   
</body>
</html>
